<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Kalkulator Wyceny Szafek</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h2 { color: #333; }
    .sekcja { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; background-color: #f9f9f9; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #aaa; padding: 8px; text-align: center; }
    th { background-color: #e0e0e0; }
    input, select { width: 90%; padding: 4px; box-sizing: border-box; }
    .podsumowanie { font-size: 1.2em; font-weight: bold; margin-top: 15px; }
  </style>
</head>
<body>

  <h2>Kalkulator Wyceny Mebli na Wymiar</h2>

  <!-- DANE ZAMAWIAJĄCEGO -->
  <div class="sekcja">
    <h3>Dane Zamawiającego</h3>
    <label>Imię i Nazwisko: <input type="text" id="klient" value="Jan Kowalski"></label><br><br>
    <label>Adres: <input type="text" id="adres" value="Spokojna 23/3"></label><br><br>
    <label>Wycena dla: 
      <select id="pomieszczenie">
        <option value="Kuchnia">Kuchnia</option>
        <option value="Garderoba">Garderoba</option>
        <option value="Łazienka">Łazienka</option>
      </select>
    </label>
  </div>

  <!-- TABELA Z WYCENĄ SZAFEK -->
  <div class="sekcja">
    <h3>Wycena Szafek</h3>
    <table>
      <thead>
        <tr>
          <th>Lp. / Szafka</th>
          <th>Płyta Korpus</th>
          <th>Płyta Front</th>
          <th>Szerokość (mm)</th>
          <th>Wysokość (mm)</th>
          <th>Głębokość (mm)</th>
          <th>Ilość Półek</th>
          <th>Cena Korpus (zł/m²)</th>
          <th>Cena Front (zł/m²)</th>
          <th>Cena Całość (zł)</th>
        </tr>
      </thead>
      <tbody id="tabela-szafek">
        <!-- Wiersz 1 -->
        <tr>
          <td>1.1 SZAFKA 1</td>
          <td>
            <select class="plyta-korpus">
              <option value="Sosna Słowiańska">Sosna Słowiańska</option>
              <option value="Dąb Craft">Dąb Craft</option>
            </select>
          </td>
          <td>
            <select class="plyta-front">
              <option value="Dąb Riviera K244">Dąb Riviera K244</option>
              <option value="Biały Połysk">Biały Połysk</option>
            </select>
          </td>
          <td><input type="number" class="szerokosc" value="500" oninput="obliczWiersz(this)"></td>
          <td><input type="number" class="wysokosc" value="500" oninput="obliczWiersz(this)"></td>
          <td><input type="number" class="glebokosc" value="300" oninput="obliczWiersz(this)"></td>
          <td><input type="number" class="ilosc-polek" value="3" oninput="obliczWiersz(this)"></td>
          <td><input type="number" class="cena-korpus" value="75" oninput="obliczWiersz(this)"></td>
          <td><input type="number" class="cena-front" value="71" oninput="obliczWiersz(this)"></td>
          <td><span class="cena-calosc">0.00</span> zł</td>
        </tr>
        <!-- Wiersz 2 -->
        <tr>
          <td>1.2 SZAFKA 2</td>
          <td>
            <select class="plyta-korpus">
              <option value="Sosna Słowiańska">Sosna Słowiańska</option>
              <option value="Dąb Craft">Dąb Craft</option>
            </select>
          </td>
          <td>
            <select class="plyta-front">
              <option value="Dąb Riviera K244">Dąb Riviera K244</option>
              <option value="Biały Połysk">Biały Połysk</option>
            </select>
          </td>
          <td><input type="number" class="szerokosc" value="0" oninput="obliczWiersz(this)"></td>
          <td><input type="number" class="wysokosc" value="0" oninput="obliczWiersz(this)"></td>
          <td><input type="number" class="glebokosc" value="0" oninput="obliczWiersz(this)"></td>
          <td><input type="number" class="ilosc-polek" value="0" oninput="obliczWiersz(this)"></td>
          <td><input type="number" class="cena-korpus" value="75" oninput="obliczWiersz(this)"></td>
          <td><input type="number" class="cena-front" value="71" oninput="obliczWiersz(this)"></td>
          <td><span class="cena-calosc">0.00</span> zł</td>
        </tr>
      </tbody>
    </table>

    <div class="podsumowanie">
      Suma całkowita: <span id="suma-ostateczna">0.00</span> zł
    </div>
  </div>

  <script src="skrypt.js"></script>
</body>
</html>
